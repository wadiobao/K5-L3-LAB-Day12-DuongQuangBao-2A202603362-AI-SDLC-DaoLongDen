<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đảo Đèn Lồng (Lantern Island)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06040d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .glass-card {
      background: rgba(18, 14, 34, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 12px;
      padding: 12px 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      pointer-events: auto;
    }
    .flames-container {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 20px;
    }
    .flame-icon {
      color: #ff9900;
      text-shadow: 0 0 10px #ff6600;
      transition: transform 0.2s ease;
    }
    .flame-icon.lost {
      opacity: 0.2;
      filter: grayscale(1);
    }
    .stats-item {
      margin-top: 6px;
      font-size: 14px;
      color: #ffd89b;
    }
    .stats-value {
      font-weight: bold;
      color: #fff;
    }
    .hud-center {
      text-align: center;
    }
    .time-badge {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffe082;
      text-shadow: 0 0 12px rgba(255, 200, 50, 0.5);
    }
    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .controls-hint {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
    }
    .key-badge {
      display: inline-block;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      font-family: monospace;
      font-weight: bold;
      color: #fff;
    }
    /* Modal Screen */
    #game-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(6, 4, 13, 0.85);
      backdrop-filter: blur(16px);
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    #game-modal h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }
    #game-modal p {
      font-size: 18px;
      color: #ffd89b;
      margin-bottom: 24px;
    }
    .btn-restart {
      padding: 12px 32px;
      background: linear-gradient(135deg, #ff9900 0%, #ff5500 100%);
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 100, 0, 0.5);
      transition: all 0.2s ease;
    }
    .btn-restart:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(255, 120, 0, 0.7);
    }
  </style>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <div id="hud">
    <div class="hud-top">
      <div class="glass-card">
        <div class="flames-container" id="flames-ui">
          <span>Ngọn Lửa:</span>
          <span class="flame-icon">🔥</span>
          <span class="flame-icon">🔥</span>
          <span class="flame-icon">🔥</span>
        </div>
        <div class="stats-item">Đom đóm: <span id="carried-count" class="stats-value">0 / 10</span></div>
        <div class="stats-item">Đèn Lớn thắp: <span id="lantern-count" class="stats-value">0 / 5</span></div>
      </div>

      <div class="glass-card hud-center">
        <div class="time-badge" id="time-display">05:00</div>
        <div class="stats-item">Điểm số: <span id="score-display" class="stats-value">0</span></div>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="glass-card controls-hint">
        <div><span class="key-badge">W</span><span class="key-badge">A</span><span class="key-badge">S</span><span class="key-badge">D</span> : Di chuyển Mây</div>
        <div><span class="key-badge">E</span> hoặc <span class="key-badge">Space</span> : Nạp ánh sáng vào Đèn Lồng (khi ở gần)</div>
        <div><span class="key-badge">F</span> : Tỏa sáng xua đuổi Bóng Mực (tốn 1 đom đóm)</div>
      </div>
    </div>
  </div>

  <div id="game-modal">
    <h1 id="modal-title">CHIẾN THẮNG!</h1>
    <p id="modal-desc">Bạn đã thắp sáng toàn bộ 5 Đèn Lồng Lớn trên Đảo Bến.</p>
    <button class="btn-restart" id="btn-restart">Chơi Lại</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
